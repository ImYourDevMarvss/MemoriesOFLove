<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ✨</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         OPENING SURPRISE
    ========================== -->

    <div id="opening" class="opening">

        <div class="opening-glow"></div>

        <div class="gift">🎁</div>

        <div class="kicker">
            A LITTLE SURPRISE
        </div>

        <h1>
            Something beautiful<br>
            is waiting for you.
        </h1>

        <button id="openBtn">
            OPEN SURPRISE ✦
        </button>

    </div>


    <!-- =========================
         MAIN EXPERIENCE
    ========================== -->

    <main id="app" class="app hidden">

        <div id="stars"></div>

        <div id="balloons"></div>

        <div id="confetti"></div>


        <!-- =====================
             HEADER
        ====================== -->

        <section class="hero">

            <div class="kicker">
                TODAY IS YOUR SPECIAL DAY
            </div>

            <h2>
                HAPPY
                <span>BIRTHDAY</span>
            </h2>

            <div id="birthdayName" class="name">
                MARVIN
            </div>

            <p>
                May your day be filled with happiness,
                unforgettable memories and beautiful moments.
            </p>

        </section>


        <!-- =====================
             CAKE
        ====================== -->

        <section class="cake-section">

            <div class="cake-glow"></div>


            <div id="cake" class="cake">


                <!-- CAKE SHADOW -->

                <div class="cake-shadow"></div>


                <!-- =================
                     CAKE PAN
                ================== -->

                <div class="cake-pan">

                    <div class="pan-highlight"></div>

                </div>


                <!-- =================
                     BOTTOM LAYER
                ================== -->

                <div class="cake-layer bottom-layer">

                    <div class="cake-body"></div>

                    <div class="frosting">

                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>

                    </div>

                    <div class="cake-line"></div>

                </div>


                <!-- =================
                     MIDDLE LAYER
                ================== -->

                <div class="cake-layer middle-layer">

                    <div class="cake-body"></div>

                    <div class="frosting">

                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>

                    </div>

                    <div class="cake-line"></div>

                </div>


                <!-- =================
                     TOP LAYER
                ================== -->

                <div class="cake-layer top-layer">

                    <div class="cake-body"></div>

                    <div class="top-frosting"></div>


                    <div class="berry berry-one">
                        🍓
                    </div>

                    <div class="berry berry-two">
                        🍓
                    </div>

                </div>


                <!-- =================
                     CANDLES
                ================== -->

                <div class="candle candle-one">

                    <div class="wick"></div>

                    <div class="flame">
                        <span></span>
                    </div>

                </div>


                <div class="candle candle-two">

                    <div class="wick"></div>

                    <div class="flame">
                        <span></span>
                    </div>

                </div>


                <div class="candle candle-three">

                    <div class="wick"></div>

                    <div class="flame">
                        <span></span>
                    </div>

                </div>


                <!-- MAGIC SPARKS -->

                <div class="spark spark-one">
                    ✦
                </div>

                <div class="spark spark-two">
                    ✧
                </div>

                <div class="spark spark-three">
                    ✦
                </div>

            </div>


            <!-- =====================
                 CONTROLS
            ====================== -->

            <div class="controls">

                <button id="wishBtn">
                    🕯️ MAKE A WISH
                </button>

                <button id="replayBtn">
                    ↻ REPLAY
                </button>

                <button id="soundBtn">
                    ♫ SOUND OFF
                </button>

            </div>


            <div id="message">

                Watch the cake come together... ✨

            </div>

        </section>


        <!-- FOOTER -->

        <footer>

            Made with
            <span>♥</span>
            for
            <strong id="footerName">
                MARVIN
            </strong>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
